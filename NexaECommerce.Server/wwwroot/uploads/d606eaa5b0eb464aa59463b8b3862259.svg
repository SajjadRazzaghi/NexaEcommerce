<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="ست زایمان">
  <title>ست زایمان</title>
  <desc>بنر دسته‌بندی لباس ست زایمان با طراحی فلت و رنگ‌های پاستلی</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f7"/>
      <stop offset="100%" stop-color="#e8f4ff"/>
    </linearGradient>

    <linearGradient id="gown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7e9e3"/>
      <stop offset="100%" stop-color="#9fd8cf"/>
    </linearGradient>

    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d0f5"/>
      <stop offset="100%" stop-color="#bfb1ec"/>
    </linearGradient>

    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd6c9"/>
      <stop offset="100%" stop-color="#ffb8a3"/>
    </linearGradient>

    <linearGradient id="onesie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7a8"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8b7f9e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <circle cx="1050" cy="120" r="140" fill="#ffffff" opacity="0.35"/>
  <circle cx="120" cy="700" r="180" fill="#ffffff" opacity="0.28"/>
  <circle cx="1120" cy="700" r="100" fill="#ffd6e7" opacity="0.35"/>
  <circle cx="80" cy="120" r="70" fill="#d9f2ee" opacity="0.45"/>

  <text x="600" y="95" text-anchor="middle"
        font-family="Vazirmatn, Tahoma, Arial, sans-serif"
        font-size="64" font-weight="800" fill="#4a3f5e"
        direction="rtl" unicode-bidi="embed">ست زایمان</text>

  <text x="600" y="145" text-anchor="middle"
        font-family="Vazirmatn, Tahoma, Arial, sans-serif"
        font-size="26" fill="#7a6f8f"
        direction="rtl" unicode-bidi="embed">راحت، کاربردی، مناسب بیمارستان و بعد از زایمان</text>

  <rect x="70" y="180" width="1060" height="560" rx="36" fill="#ffffff" opacity="0.72" filter="url(#shadow)"/>

  <rect x="900" y="205" width="170" height="52" rx="26" fill="#ffe3ef"/>
  <text x="985" y="239" text-anchor="middle"
        font-family="Vazirmatn, Tahoma, Arial, sans-serif"
        font-size="22" font-weight="700" fill="#b04a72"
        direction="rtl" unicode-bidi="embed">ست ۷ تکه</text>

  <!-- پیراهن زایمان -->
  <g filter="url(#shadow)">
    <path d="M260 240 L300 290 L340 240 L380 260 L410 320 L370 340 L370 520 L230 520 L230 340 L190 320 L220 260 Z" fill="url(#gown)"/>
    <path d="M260 240 L300 290 L340 240" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.6"/>
    <rect x="230" y="390" width="140" height="12" rx="6" fill="#ffffff" opacity="0.6"/>
    <circle cx="300" cy="396" r="8" fill="#ffffff" opacity="0.9"/>
    <text x="300" y="560" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="20" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">پیراهن زایمان</text>
  </g>

  <!-- شلوار بعد از زایمان -->
  <g filter="url(#shadow)">
    <path d="M470 280 L610 280 L610 330 L600 520 L540 520 L540 380 L510 520 L450 520 L470 330 Z" fill="url(#pants)"/>
    <rect x="470" y="280" width="140" height="28" rx="14" fill="#ffffff" opacity="0.5"/>
    <line x1="540" y1="330" x2="540" y2="520" stroke="#ffffff" stroke-width="8" opacity="0.5"/>
    <text x="530" y="560" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="20" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">شلوار بعد از زایمان</text>
  </g>

  <!-- تاپ شیردهی -->
  <g filter="url(#shadow)">
    <path d="M720 300 L840 300 L870 360 L840 380 L840 480 L720 480 L720 380 L690 360 Z" fill="url(#top)"/>
    <path d="M720 300 Q780 340 840 300" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.6"/>
    <rect x="740" y="400" width="80" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <text x="780" y="560" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="20" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">تاپ شیردهی</text>
  </g>

  <!-- سرهمی نوزاد -->
  <g filter="url(#shadow)">
    <path d="M960 300 L1020 300 L1050 330 L1030 360 L1030 440 L1010 440 L1010 480 L990 480 L990 440 L970 440 L970 480 L950 480 L950 440 L930 440 L930 360 L910 330 Z" fill="url(#onesie)"/>
    <circle cx="990" cy="360" r="10" fill="#ffffff" opacity="0.6"/>
    <text x="980" y="560" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="20" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">سرهمی نوزاد</text>
  </g>

  <!-- قنداق / پتو -->
  <g filter="url(#shadow)">
    <rect x="180" y="610" width="220" height="70" rx="22" fill="#ffd6e7"/>
    <path d="M210 625 Q290 645 370 625" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>
    <path d="M210 665 Q290 645 370 665" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>
    <text x="290" y="720" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="18" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">قنداق / پتو نوزاد</text>
  </g>

  <!-- جوراب -->
  <g filter="url(#shadow)">
    <path d="M470 625 Q490 610 510 625 L510 665 Q510 680 490 680 L470 680 Q450 680 450 665 L450 645 Q450 630 470 625 Z" fill="#bde0fe"/>
    <path d="M540 625 Q560 610 580 625 L580 665 Q580 680 560 680 L540 680 Q520 680 520 665 L520 645 Q520 630 540 625 Z" fill="#bde0fe"/>
    <text x="520" y="720" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="18" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">جوراب</text>
  </g>

  <!-- هدبند -->
  <g filter="url(#shadow)">
    <path d="M700 670 Q760 610 820 670" fill="none" stroke="#cdb4db" stroke-width="18" stroke-linecap="round"/>
    <circle cx="760" cy="625" r="14" fill="#ffc8dd"/>
    <text x="760" y="720" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="18" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">هدبند</text>
  </g>

  <!-- کلاه نوزاد -->
  <g filter="url(#shadow)">
    <path d="M920 670 Q920 610 980 610 Q1040 610 1040 670 Z" fill="#a2d2ff"/>
    <rect x="920" y="660" width="120" height="18" rx="9" fill="#ffffff" opacity="0.65"/>
    <circle cx="980" cy="610" r="12" fill="#ffffff" opacity="0.8"/>
    <text x="980" y="720" text-anchor="middle"
          font-family="Vazirmatn, Tahoma, Arial, sans-serif"
          font-size="18" fill="#5b4f6b"
          direction="rtl" unicode-bidi="embed">کلاه نوزاد</text>
  </g>
</svg>